<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Molly Xiong</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
body{
    font-family: Arial, sans-serif;
    line-height:1.6;
    margin:0;
    padding:0;
    text-align:center;
}

.header-image{
    width:100%;
    max-height:300px;
    object-fit:cover;
}

.welcome-section{
    max-width:800px;
    margin:0 auto;
    padding:50px 20px;
}

.name{
    font-family:'Press Start 2P',cursive;
    font-size:2.5rem;
    margin-bottom:20px;
}

.social-buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-top:20px;
}

.social-button{
    display:inline-block;
    background-color:#FFB6C1;
    color:white;
    padding:8px 15px;
    text-decoration:none;
    border-radius:5px;
    font-weight:bold;
    font-size:0.9rem;
    transition:background-color 0.3s ease;
}

.social-button:hover{
    background-color:#FF69B4;
}

.intro-section{
    background-color:#FFE4E1;
    padding:30px 20px;
    margin:20px 0;
    max-width:800px;
    margin-left:auto;
    margin-right:auto;
    border-radius:10px;
}

.personal-image{
    max-width:300px;
    max-height:400px;
    border-radius:10px;
    margin-top:20px;
    object-fit:cover;
    box-shadow:0 4px 6px rgba(0,0,0,0.1);
}

.project-section{
    max-width:800px;
    margin:0 auto;
    padding:50px 20px;
    text-align:left;
}

.project-title{
    font-size:2rem;
    margin-bottom:20px;
}

.project-description{
    margin-bottom:20px;
}

.project-image{
    width:100%;
    max-width:600px;
    border-radius:10px;
    margin-top:15px;
}

.carousel{
    position:relative;
    width:100%;
    max-width:800px;
    margin:0 auto;
    overflow:hidden;
}

.carousel-item{
    display:none;
    width:100%;
}

.carousel-item.active{
    display:block;
}

.carousel img,.carousel video{
    width:100%;
    max-height:450px;
    object-fit:cover;
}

.carousel-control{
    cursor:pointer;
    position:absolute;
    top:50%;
    width:50px;
    height:50px;
    background:rgba(0,0,0,0.5);
    color:white;
    transform:translateY(-50%);
    display:flex;
    align-items:center;
    justify-content:center;
}

.carousel-control.prev{
    left:10px;
}

.carousel-control.next{
    right:10px;
}

/* Art gallery */
.art-gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,160px));
    justify-content:center;
    gap:15px;
    margin-top:25px;
    overflow:visible;
}

.art-gallery img{
    width:160px;
    height:130px;
    object-fit:cover;
    border-radius:8px;
    box-shadow:0 4px 6px rgba(0,0,0,0.1);
    transition:transform 0.3s ease;
    cursor:pointer;
}

.art-gallery img:hover{
    transform:scale(2);
    z-index:20;
}
</style>
</head>

<body>

<img src="header.png" alt="Header" class="header-image">

<div class="welcome-section">
<h1 class="name">Molly Xiong</h1>
<h2>Portfolio!</h2>

<div class="intro-section">
<p>
</p>
</div>

<p>Scroll down to see my projects!</p>

<div class="social-buttons">
<a href="https://www.linkedin.com/in/molly-x-367346249/" target="_blank" class="social-button">
LinkedIn
</a>
<a href="https://github.com/fattestmoth" target="_blank" class="social-button">
GitHub
</a>
</div>
</div>

<div class="art-gallery">


</div>
</div>

<script>
function changeSlide(carousel,direction){
    const slides = carousel.closest('.carousel').querySelectorAll('.carousel-item');
    const currentSlide = Array.from(slides).findIndex(slide => slide.classList.contains('active'));
    slides[currentSlide].classList.remove('active');
    const newSlideIndex = (currentSlide + direction + slides.length) % slides.length;
    slides[newSlideIndex].classList.add('active');
}
</script>

</body>
</html>
